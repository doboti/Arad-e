name: Collect water levels

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r etl/requirements.txt

      - run: python etl/run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/holaviz.sqlite3
          git diff --cached --quiet || git commit -m "Update water level data [skip ci]"
          git push

      # The spec flags source-site breakage as the main operational risk and
      # asks for an alert when the scraper can't find data. GitHub Issues
      # need no secrets to set up, unlike email/Discord, so that's the alert
      # channel here: one open issue per outage, closed automatically once
      # a run succeeds again.
      - name: Open/update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "scraper-failure";
            const title = "Adatgyűjtés sikertelen (etl/run.py hiba)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Továbbra is hibázik az órás futás. Log: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body: [
                  "Az órás vízállás-/talajnedvesség-gyűjtés hibával leállt.",
                  "",
                  `Log: ${runUrl}`,
                  "",
                  "Valószínű ok: a vizugy.hu vagy az Open-Meteo API válasza megváltozott, vagy éppen elérhetetlen.",
                  "Ez az issue automatikusan lezárul, ha egy következő futás sikeres lesz.",
                ].join("\n"),
              });
            }

      - name: Close stale failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "scraper-failure";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "A legutóbbi futás sikeres volt, az adatgyűjtés helyreállt.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
